<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAbility 2026 — Seating Chart</title>
<style>
  :root{
    --ink:#1b1f23;
    --paper:#f7f5f1;
    --panel:#ffffff;
    --line:#d8d3c8;
    --muted:#767268;
    --accent:#1b1f23;
    --space-bg:#eef0f2;
    --blank-bg:transparent;
    --door:#c0392b;
    --highlight:#ffd23f;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:24px 16px 64px;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  header.page-head{
    text-align:center;
    margin-bottom:28px;
  }
  header.page-head .eyebrow{
    letter-spacing:.18em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--muted);
    font-weight:700;
  }
  header.page-head h1{
    font-size:clamp(28px,4vw,42px);
    margin:6px 0 8px;
    letter-spacing:-0.02em;
  }
  header.page-head p{
    color:var(--muted);
    margin:0;
    font-size:14.5px;
  }

  /* ---------- Search ---------- */
  .search-box{
    position:sticky;
    top:10px;
    z-index:50;
    max-width:640px;
    margin:0 auto 28px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    box-shadow:0 6px 22px rgba(20,20,20,.08);
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 8px 6px 20px;
  }
  .search-box svg{flex:0 0 auto;color:var(--muted);}
  .search-box input{
    flex:1;
    border:none;
    outline:none;
    font-size:16px;
    padding:12px 4px;
    background:transparent;
    color:var(--ink);
    font-family:inherit;
  }
  .search-box input::placeholder{color:#a9a49a;}
  .search-clear{
    border:none;
    background:var(--ink);
    color:#fff;
    border-radius:999px;
    padding:10px 18px;
    font-size:13.5px;
    cursor:pointer;
    font-weight:600;
    display:none;
  }
  .search-clear.show{display:inline-block;}

  .results{
    max-width:900px;
    margin:0 auto 28px;
    display:none;
  }
  .results.show{display:block;}
  .results .count{
    font-size:13px;
    color:var(--muted);
    margin-bottom:10px;
    padding-left:4px;
  }
  .result-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 18px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .result-card:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.08);}
  .result-card .rc-left{display:flex;align-items:center;gap:12px;}
  .rc-swatch{width:10px;height:34px;border-radius:4px;flex:0 0 auto;}
  .rc-name{font-weight:700;font-size:15.5px;}
  .rc-leader{font-size:13px;color:var(--muted);}
  .rc-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;}
  .pill{
    background:var(--space-bg);
    border:1px solid var(--line);
    padding:4px 10px;
    border-radius:999px;
    font-weight:600;
    white-space:nowrap;
  }
  .pill.warn{background:#fff3cd;border-color:#f0d98c;color:#7a5c00;}
  .no-results{
    text-align:center;
    color:var(--muted);
    padding:30px 0;
    font-size:14.5px;
  }

  /* ---------- Legend ---------- */
  .legend{
    max-width:1100px;
    margin:0 auto 34px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .legend .chip{
    display:flex;align-items:center;gap:7px;
    font-size:12px;font-weight:600;
    border:1px solid var(--line);
    border-radius:999px;
    padding:5px 12px 5px 8px;
    background:var(--panel);
  }
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}

  /* ---------- Rooms ---------- */
  .rooms{
    display:flex;
    gap:28px;
    justify-content:center;
    flex-wrap:wrap;
    align-items:flex-start;
  }
  .room-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 20px 26px;
    box-shadow:0 10px 30px rgba(20,20,20,.05);
    width:100%;
    max-width:520px;
  }
  .room-head{
    margin-bottom:2px;
  }
  .room-head h2{
    font-size:19px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .wall-top, .wall-bottom{
    position:relative;
    display:flex;
    gap:14px;
  }
  .wall-top{
    border-top:3px solid var(--ink);
    margin-top:14px;
    padding-top:10px;
    align-items:flex-start;
  }
  .wall-bottom{
    border-bottom:3px solid var(--ink);
    margin-top:6px;
    margin-bottom:0;
    padding-bottom:10px;
    align-items:flex-end;
  }
  .wall-full{ justify-content:space-between; }
  .wall-simple{ justify-content:flex-end; }
  .tv-icon{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    flex:0 0 auto;
    margin:0 auto;
  }
  .tv-icon .tv-bar{
    width:110px;
    height:12px;
    background:#eeeeee;
    border:2px solid var(--ink);
    border-radius:2px;
  }
  .tv-icon .tv-label{
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.05em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .door-badge{
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--door);
    border:1px solid var(--door);
    border-radius:999px;
    padding:4px 10px;
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
    flex:0 0 auto;
  }
  .front-door-block{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;
    flex:0 0 auto;
    text-align:right;
  }
  .front-door-block .room-sub{
    margin:0;
    max-width:170px;
    text-align:right;
  }
  .room-sub{font-size:11.5px;color:var(--muted);margin:0 0 16px;line-height:1.4;}
  .grid{
    display:flex;
    flex-direction:column;
    gap:3px;
    position:relative;
  }
  .grid-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:3px;
  }
  .grid-row.row-space{
    grid-template-columns:1fr;
    height:12px;
  }
  .grid-row.row-space .aisle{
    height:100%;
    border-top:1px dashed #c7c2b6;
    border-bottom:1px dashed #c7c2b6;
    background:repeating-linear-gradient(45deg, #eceae4, #eceae4 4px, #f7f5f1 4px, #f7f5f1 8px);
    border-radius:3px;
  }
  .grid-row.row-blank{height:7px;}
  .seat{
    border-radius:6px;
    padding:5px 6px;
    min-height:38px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:1px;
    color:#fff;
    cursor:default;
    transition:transform .15s ease, box-shadow .15s ease, outline .15s ease;
    position:relative;
    overflow:hidden;
  }
  .seat .t-name{font-size:10.3px;font-weight:700;line-height:1.15;overflow-wrap:anywhere;}
  .seat .t-leader{font-size:8.6px;opacity:.85;line-height:1.1;overflow-wrap:anywhere;}
  .seat .t-ps{
    position:absolute;
    top:2px; right:4px;
    font-size:7.5px;
    font-weight:700;
    opacity:.65;
    letter-spacing:.03em;
  }
  .seat.empty{
    background:repeating-linear-gradient(135deg, #ececec, #ececec 4px, #f7f5f1 4px, #f7f5f1 8px);
    color:#9c9890;
  }
  .seat.empty .t-name{font-size:9.5px;font-weight:600;}
  .seat.highlight{
    outline:3px solid var(--highlight);
    outline-offset:1px;
    transform:scale(1.06);
    box-shadow:0 6px 18px rgba(0,0,0,.28);
    z-index:5;
  }
  .seat.dim{opacity:.25;}

  /* ---------- "Your team" marker ---------- */
  .seat.you{
    outline:3px solid #22c55e;
    outline-offset:2px;
    overflow:visible;
    z-index:6;
    animation:youPulse 1.8s ease-in-out infinite;
  }
  .seat.you .you-badge{
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    background:#22c55e;
    color:#fff;
    font-size:8.5px;
    font-weight:800;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
    box-shadow:0 3px 10px rgba(34,197,94,.45);
    z-index:7;
    pointer-events:none;
  }
  .seat.you .you-badge::after{
    content:'';
    position:absolute;
    bottom:-4px;
    left:50%;
    transform:translateX(-50%);
    border:4px solid transparent;
    border-top-color:#22c55e;
    border-bottom:none;
  }
  @keyframes youPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.55);}
    50%{box-shadow:0 0 0 7px rgba(34,197,94,0);}
  }

  .overflow-note{
    max-width:900px;
    margin:34px auto 0;
    background:#fff8e6;
    border:1px solid #f0d98c;
    border-radius:14px;
    padding:16px 20px;
    font-size:13.5px;
  }
  .overflow-note h3{margin:0 0 8px;font-size:14.5px;}
  .overflow-note ul{margin:0;padding-left:18px;}
  .overflow-note li{margin-bottom:3px;}

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:40px;
  }

  @media (max-width:600px){
    .search-box{position:static;}
    .seat .t-leader{display:none;}
  }

  /* ---------- Dark mode ---------- */
  body.dark{
    --ink:#e7e9ec;
    --paper:#000000;
    --panel:#0e1319;
    --line:#262c35;
    --muted:#9aa3ad;
    --space-bg:#161b22;
  }
  body.dark .search-box{box-shadow:0 6px 22px rgba(0,0,0,.45);}
  body.dark .search-box input::placeholder{color:#6b7480;}
  body.dark .search-clear{background:#e7e9ec;color:#0b0f14;}
  body.dark .result-card:hover{box-shadow:0 6px 16px rgba(0,0,0,.5);}
  body.dark .pill.warn{background:#3a2f0d;border-color:#6b5716;color:#e8c85a;}
  body.dark .room-card{box-shadow:0 10px 30px rgba(0,0,0,.4);}
  body.dark .wall-top{border-top-color:#a7b0ba;}
  body.dark .wall-bottom{border-bottom-color:#a7b0ba;}
  body.dark .tv-icon .tv-bar{background:#2c333d;border-color:#a7b0ba;}
  body.dark .grid-row.row-space .aisle{
    border-top-color:#333a44;
    border-bottom-color:#333a44;
    background:repeating-linear-gradient(45deg, #161b22, #161b22 4px, #0a0e13 4px, #0a0e13 8px);
  }
  body.dark .seat.empty{
    background:repeating-linear-gradient(135deg, #1a2129, #1a2129 4px, #10151b 4px, #10151b 8px);
    color:#8b93a0;
  }
  body.dark .overflow-note{background:#2a2410;border-color:#5c4d16;}
</style>
</head>

":"Anew201","row":25,"col":0},{"team":"InkSpire","leader":"Durgaprasad V","ps":"PS-08","room":"Anew201","row":26,"col":0}],"overflow":[]}
</script>
<script>
(function(){
  // Apply theme from ?theme= query param (set by the app) or saved app theme
  try {
    var params = new URLSearchParams(window.location.search);
    var theme = params.get('theme') || localStorage.getItem('sh_theme') || 'light';
    theme = theme.replace(/"/g, '');
    document.body.classList.toggle('dark', theme === 'dark');
  } catch (e) { /* default light */ }

  var DATA = JSON.parse(document.getElementById('seatData').textContent);
  var rooms = DATA.rooms;
  var colors = DATA.colors;
  var index = DATA.index;
  var overflow = DATA.overflow;

  var roomLabels = {
    "Anew202": {title: "Room Anew202", sub: "Tables PS-05 · PS-06 · PS-07 · PS-09 · PS-11", doorSide: "bottom"},
    "Anew201": {title: "Room Anew201", sub: "Tables PS-01 · PS-02 · PS-03 · PS-04 · PS-08 · PS-10", doorSide: "top"}
  };
  var roomOrder = ["Anew202", "Anew201"];

  function esc(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- Render legend ----------
  var legendEl = document.getElementById('legend');
  Object.keys(colors).sort().forEach(function(ps){
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = '<span class="dot" style="background:'+colors[ps]+'"></span>' + ps;
    legendEl.appendChild(chip);
  });

  // ---------- Render rooms ----------
  var container = document.getElementById('roomsContainer');

  roomOrder.forEach(function(roomKey){
    var meta = roomLabels[roomKey];
    var card = document.createElement('div');
    card.className = 'room-card';
    card.id = 'room-' + roomKey;

    var head = document.createElement('div');
    head.className = 'room-head';
    head.innerHTML = '<h2>'+meta.title+'</h2>';
    card.appendChild(head);

    function wallBlock(position, isFront){
      // position: 'wall-top' or 'wall-bottom' (controls border/margin side)
      // isFront: whether THIS wall is the front (TV + front door) or back (back door only)
      var wall = document.createElement('div');
      wall.className = position + ' ' + (isFront ? 'wall-full' : 'wall-simple');
      var doorLabel = isFront ? 'Front Door' : 'Back Door';
      if(isFront){
        wall.innerHTML =
          '<div style="width:80px;"></div>' +
          '<div class="tv-icon"><div class="tv-bar"></div><div class="tv-label">TV / Screen</div></div>' +
          '<div class="front-door-block">' +
            '<span class="door-badge">🚪 '+doorLabel+'</span>' +
            '<p class="room-sub">'+meta.sub+'</p>' +
          '</div>';
      } else {
        wall.innerHTML = '<span class="door-badge">🚪 '+doorLabel+'</span>';
      }
      return wall;
    }

    var frontIsTop = (meta.doorSide === 'top');
    card.appendChild(wallBlock('wall-top', frontIsTop));

    var grid = document.createElement('div');
    grid.className = 'grid';

    rooms[roomKey].forEach(function(row, ridx){
      var isSpace = row.every(function(c){return c.type==='space';});
      var isBlank = row.every(function(c){return c.type==='blank';});
      var rowEl = document.createElement('div');

      if(isSpace){
        rowEl.className = 'grid-row row-space';
        var a = document.createElement('div');
        a.className = 'aisle';
        rowEl.appendChild(a);
        grid.appendChild(rowEl);
        return;
      }
      if(isBlank){
        rowEl.className = 'grid-row row-blank';
        grid.appendChild(rowEl);
        return;
      }

      rowEl.className = 'grid-row';
      row.forEach(function(cell){
        var seatEl = document.createElement('div');
        if(cell.type === 'seat'){
          seatEl.className = 'seat';
          seatEl.style.background = colors[cell.ps] || '#888';
          if(cell.team){
            seatEl.innerHTML = '<span class="t-ps">'+cell.ps+'</span><span class="t-name">'+esc(cell.team)+'</span><span class="t-leader">'+esc(cell.leader)+'</span>';
            seatEl.dataset.team = cell.team.toLowerCase();
            seatEl.dataset.leader = (cell.leader||'').toLowerCase();
          } else {
            seatEl.classList.add('empty');
            seatEl.innerHTML = '<span class="t-ps">'+cell.ps+'</span><span class="t-name">'+cell.ps+' — unassigned</span>';
          }
          seatEl.dataset.ps = cell.ps;
        } else {
          seatEl.className = 'seat empty';
          seatEl.style.visibility = 'hidden';
        }
        rowEl.appendChild(seatEl);
      });
      grid.appendChild(rowEl);
    });

    card.appendChild(grid);

    card.appendChild(wallBlock('wall-bottom', !frontIsTop));

    container.appendChild(card);
  });

  // ---------- Overflow note ----------
  if(overflow && overflow.length){
    var note = document.getElementById('overflowNote');
    var list = document.getElementById('overflowList');
    overflow.forEach(function(o){
      var li = document.createElement('li');
      li.textContent = o.team + ' — ' + o.leader + ' (' + o.ps + ', ' + o.room + ')';
      list.appendChild(li);
    });
    note.style.display = 'block';
  }

  // ---------- "Your team is here" marker ----------
  try {
    var myTeamParam = new URLSearchParams(window.location.search).get('myteam');
    if (myTeamParam) {
      var norm = function(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); };
      var wanted = norm(myTeamParam);
      var mySeat = null;
      document.querySelectorAll('.seat[data-team]').forEach(function(el){
        if (mySeat) return;
        if (el.dataset.team === myTeamParam.trim().toLowerCase() || norm(el.dataset.team) === wanted) {
          mySeat = el;
        }
      });
      if (mySeat) {
        mySeat.classList.add('you');
        var badge = document.createElement('span');
        badge.className = 'you-badge';
        badge.textContent = 'Your team is here';
        mySeat.appendChild(badge);
        setTimeout(function(){
          mySeat.scrollIntoView({behavior:'smooth', block:'center'});
        }, 400);
      }
    }
  } catch (e) { /* marker is best-effort */ }

  // ---------- Search ----------
  var input = document.getElementById('searchInput');
  var clearBtn = document.getElementById('clearBtn');
  var resultsEl = document.getElementById('results');
  var resultCount = document.getElementById('resultCount');
  var resultList = document.getElementById('resultList');

  function clearHighlights(){
    document.querySelectorAll('.seat.highlight').forEach(function(el){ el.classList.remove('highlight'); });
    document.querySelectorAll('.seat.dim').forEach(function(el){ el.classList.remove('dim'); });
  }

  function runSearch(q){
    q = q.trim().toLowerCase();
    clearHighlights();
    if(!q){
      resultsEl.classList.remove('show');
      return;
    }
    var matches = index.filter(function(t){
      return t.team.toLowerCase().indexOf(q) !== -1 || (t.leader||'').toLowerCase().indexOf(q) !== -1;
    });

    resultsEl.classList.add('show');
    resultCount.textContent = matches.length + (matches.length===1 ? ' match' : ' matches');
    resultList.innerHTML = '';

    if(matches.length === 0){
      resultList.innerHTML = '<div class="no-results">No team or leader matches “'+esc(q)+'”. Try a different spelling.</div>';
      return;
    }

    var anySeated = document.querySelectorAll('.seat[data-team], .seat[data-ps]').length > 0;
    if(anySeated){
      document.querySelectorAll('.seat').forEach(function(el){
        if(el.style.visibility !== 'hidden') el.classList.add('dim');
      });
    }

    matches.forEach(function(m, i){
      var card = document.createElement('div');
      card.className = 'result-card';
      var seatInfo = m.room ? m.room : (m.overflowRoom ? (m.overflowRoom + ' · extra seat') : 'Not yet seated');
      var pillClass = m.room ? 'pill' : 'pill warn';
      card.innerHTML =
        '<div class="rc-left">' +
          '<div class="rc-swatch" style="background:'+(colors[m.ps]||'#888')+'"></div>' +
          '<div><div class="rc-name">'+esc(m.team)+'</div><div class="rc-leader">'+esc(m.leader)+'</div></div>' +
        '</div>' +
        '<div class="rc-meta"><span class="pill">'+m.ps+'</span><span class="'+pillClass+'">'+seatInfo+'</span></div>';

      card.addEventListener('click', function(){
        highlightAndScroll(m);
      });
      resultList.appendChild(card);

      if(i===0) highlightAndScroll(m);
    });
  }

  function highlightAndScroll(m){
    clearHighlights();
    if(!m.room) return;
    var roomCard = document.getElementById('room-' + m.room);
    if(!roomCard) return;
    var seats = roomCard.querySelectorAll('.seat[data-team]');
    var target = null;
    seats.forEach(function(el){
      if(el.dataset.team === m.team.toLowerCase() && el.dataset.leader === (m.leader||'').toLowerCase()){
        target = el;
      }
    });
    document.querySelectorAll('.seat').forEach(function(el){
      if(el.style.visibility !== 'hidden' && el !== target) el.classList.add('dim');
    });
    if(target){
      target.classList.add('highlight');
      target.classList.remove('dim');
      target.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }

  input.addEventListener('input', function(){
    clearBtn.classList.toggle('show', input.value.length>0);
    runSearch(input.value);
  });
  clearBtn.addEventListener('click', function(){
    input.value = '';
    clearBtn.classList.remove('show');
    runSearch('');
    input.focus();
  });
})();

</script>
